name: Validate suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Pinned docs-cli release this suite is tested against and vendors the
      # `docs` skill from. The policy is to track the newest docs-cli: when a
      # newer release ships, re-vendor the skill (docs install-skill --force)
      # and bump this pin in the same change. See marketplace-publishing-guide.md.
      DOCS_CLI_VERSION: "1.8.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator
        run: python3 -m pip install "PyYAML==6.0.2"

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool plugins/agent-playbook-suite/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/agent-playbook-suite/.claude-plugin/plugin.json >/dev/null

      - name: Validate skill payload shape
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "create-milestones",
              "docs",
              "explore",
              "project-foundation",
              "ship-milestone",
              "simplify",
              "sync-and-commit",
              "use-cases",
          }
          skills = Path("plugins/agent-playbook-suite/skills")
          actual = {p.name for p in skills.iterdir() if p.is_dir()}
          missing = expected - actual
          unexpected = actual - expected - {"_shared"}
          if missing or unexpected:
              raise SystemExit(
                  f"Unexpected skill dirs: missing={sorted(missing)} "
                  f"unexpected={sorted(unexpected)}"
              )

          for skill in expected:
              skill_file = skills / skill / "SKILL.md"
              if not skill_file.exists():
                  raise SystemExit(f"Missing {skill_file}")

          shared_skill = skills / "_shared" / "SKILL.md"
          if shared_skill.exists():
              raise SystemExit("_shared must not contain SKILL.md")

          nested_git = list(skills.rglob(".git"))
          if nested_git:
              raise SystemExit(f"Nested .git dirs are not allowed: {nested_git}")
          PY

      - name: Validate skill interface metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          skills = Path("plugins/agent-playbook-suite/skills")
          required = {"explore"}

          for skill in required:
              path = skills / skill / "agents" / "openai.yaml"
              if not path.exists():
                  raise SystemExit(f"Missing {path}")
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.get("interface"), dict):
                  raise SystemExit(f"{path} must contain an interface mapping")
              interface = data["interface"]
              for key in ("display_name", "short_description", "default_prompt"):
                  value = interface.get(key)
                  if not isinstance(value, str) or not value.strip():
                      raise SystemExit(f"{path} missing non-empty interface.{key}")
              if not 25 <= len(interface["short_description"]) <= 64:
                  raise SystemExit(f"{path} short_description must be 25-64 characters")
              if f"${skill}" not in interface["default_prompt"]:
                  raise SystemExit(f"{path} default_prompt must mention ${skill}")
              if skill == "explore":
                  prompt = interface["default_prompt"].lower()
                  required_terms = (
                      "compare",
                      "feasibility",
                      "recovery",
                      "evidence-backed",
                      "exact unresolved gap",
                  )
                  missing = [term for term in required_terms if term not in prompt]
                  if missing:
                      raise SystemExit(
                          f"{path} default_prompt missing explore modes/outcomes: {missing}"
                      )
          PY

      - name: Validate quality-model coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          skills = Path("plugins/agent-playbook-suite/skills")
          shared = skills / "_shared" / "references" / "agentic-quality-model.md"
          if not shared.exists():
              raise SystemExit(f"Missing shared quality model: {shared}")

          shared_text = shared.read_text(encoding="utf-8").lower()
          for term in (
              "contract layer",
              "visible red tests",
              "hidden/generalization",
              "adequacy tests",
              "risk levels",
              "mock policy",
              "forbidden shortcuts",
              "solution uncertainty",
          ):
              if term not in shared_text:
                  raise SystemExit(f"Shared quality model missing term: {term}")

          required = {
              "explore": (
                  "solution uncertainty",
                  "pattern-preservation",
                  "simplicity gate",
                  "operator-owned product decision",
                  "no viable route",
                  "contract owner",
              ),
              "project-foundation": ("hidden/generalization", "risk level", "mock"),
              "create-milestones": ("hidden/generalization", "mock", "mutation"),
              "ship-milestone": ("hidden/generalization", "mock", "mutation"),
              "sync-and-commit": ("hidden/generalization", "mock", "mutation", "risk level"),
              "simplify": ("hidden/generalization", "mock", "mutation", "risk level"),
              "docs": ("quality artifacts", "docs check", "generated reports", "mutation"),
              "use-cases": ("use case", "test matrices"),
          }
          for skill, terms in required.items():
              text = "\n".join(
                  p.read_text(encoding="utf-8")
                  for p in (skills / skill).rglob("*.md")
              ).lower()
              missing = [term for term in terms if term not in text]
              if missing:
                  raise SystemExit(f"{skill} missing quality-model terms: {missing}")
          PY

      - name: Install docs-cli (pinned tested version)
        run: python3 -m pip install "docs-cli==${DOCS_CLI_VERSION}"

      - name: Validate docs-cli runtime contract
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          import tempfile

          version_output = subprocess.check_output(["docs", "--version"], text=True).strip()
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", version_output)
          if not match:
              raise SystemExit(f"Could not parse docs-cli version from: {version_output!r}")
          version = tuple(int(part) for part in match.groups())

          # DOCS_CLI_VERSION is the source of truth for the docs-cli release
          # tested here. The maintainer refresh process vendors the matching
          # `docs` skill; this check fails when the installed binary drifts.
          pinned = tuple(int(part) for part in os.environ["DOCS_CLI_VERSION"].split("."))
          if version != pinned:
              raise SystemExit(
                  f"Expected pinned docs-cli {os.environ['DOCS_CLI_VERSION']}; got {version_output}"
              )

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / ".docs.toml").write_text(
                  '[project]\nname = "ci"\n',
                  encoding="utf-8",
              )
              for name in ("a.md", "b.md"):
                  (root / name).write_text(
                      "# Doc\n\n"
                      "Lifecycle: active\n"
                      "Role: spec\n"
                      "Project: ci\n"
                      "Updated: 2000-01-01\n\n",
                      encoding="utf-8",
                  )
              subprocess.check_call(["docs", "touch", "a.md", "b.md"], cwd=root)
          PY

      - name: Validate workflow consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          skills = root / "plugins" / "agent-playbook-suite" / "skills"

          checks = [
              (
                  skills / "ship-milestone" / "SKILL.md",
                  [
                      "m4-*-test-matrix.md",
                      "task plan, implementation log, and test matrix",
                      "Related: pairs-with",
                      "Conditional exploration handoff",
                      "Contract-change recovery",
                      "WIP/blocker checkpoint",
                      "exploration checkpoint commit",
                      "Step 2 planning agent",
                      "INSUFFICIENT EVIDENCE",
                  ],
              ),
              (
                  skills / "ship-milestone" / "references" / "agent-prompts.md",
                  [
                      "milestone test matrix",
                      "<slug>-test-matrix.md",
                      "hidden/generalization categories",
                      "Planning resume after exploration",
                      "Contract-change marker checkpoint",
                      "EXPLORATION SIGNAL: NONE",
                      "BLOCKER DOSSIER",
                  ],
              ),
              (
                  skills / "project-foundation" / "references" / "foundation-playbook.md",
                  ["Invoke `explore`", "options-comparison.md"],
              ),
              (
                  skills / "create-milestones" / "references" / "tdd-phases.md",
                  ["Solution-uncertainty checkpoint", "implementation log"],
              ),
              (
                  skills / "sync-and-commit" / "SKILL.md",
                  [
                      "High-risk work in or after Phase 5",
                      "Phase 4 RED-baseline checkpoint",
                      "High-risk RED-baseline approval",
                  ],
              ),
              (
                  skills / "project-foundation" / "references" / "role-mapping.md",
                  ["m<N>-test-matrix", "quality/m<N>-quality-log"],
              ),
              (
                  root / "overview.md",
                  ["implementation log, and test matrix", "quality logs"],
              ),
              (
                  root / "blog-post.md",
                  ["milestone doc", "implementation log", "test matrix", "use-cases.md"],
              ),
              (
                  root / "site" / "blog.md",
                  ["milestone doc", "implementation log", "test matrix", "use-cases.md"],
              ),
          ]

          for path, required in checks:
              text = path.read_text(encoding="utf-8")
              missing = [needle for needle in required if needle not in text]
              if missing:
                  raise SystemExit(f"{path} missing workflow consistency terms: {missing}")

          foundation_path = (
              skills
              / "project-foundation"
              / "references"
              / "foundation-playbook.md"
          )
          foundation = foundation_path.read_text(encoding="utf-8")
          record_command = "`docs new decision options-comparison`"
          comparison_step = "Use the ordinary comparison"
          if foundation.count(record_command) != 1:
              raise SystemExit(
                  "Foundation must create options-comparison exactly once"
              )
          if not 0 <= foundation.find(record_command) < foundation.find(comparison_step):
              raise SystemExit(
                  "Foundation must create options-comparison before comparison"
              )
          for disposition in (
              "`OPERATOR DECISION`",
              "`NO VIABLE ROUTE`",
              "`INSUFFICIENT EVIDENCE`",
          ):
              if disposition not in foundation or "leave it draft" not in foundation:
                  raise SystemExit(
                      "Unresolved foundation exploration must leave its record draft"
                  )

          def between(path, start, end):
              text = path.read_text(encoding="utf-8")
              try:
                  return text.split(start, 1)[1].split(end, 1)[0]
              except IndexError as exc:
                  raise SystemExit(
                      f"{path} missing section boundary: {start!r} / {end!r}"
                  ) from exc

          ship_path = skills / "ship-milestone" / "SKILL.md"
          prompts_path = ship_path.parent / "references" / "agent-prompts.md"
          section_checks = [
              (
                  between(
                      ship_path,
                      "### Conditional exploration handoff",
                      "### Contract-change recovery",
                  ),
                  [
                      "Route its returned final disposition through this list",
                      "only a returned `SELECTED` may resume",
                      "Only after the contract owner",
                      "explicitly approves changing",
                      "Exploration never edits the milestone contract",
                  ],
              ),
              (
                  between(
                      prompts_path,
                      "### Planning resume after exploration",
                      "### Exploration resume after an operator decision",
                  ),
                  [
                      "milestone behavior contract, fixed constraints, and",
                      "If the handoff requires changing",
                      "return `CONTRACT CHANGE REQUIRED`",
                  ],
              ),
              (
                  between(
                      prompts_path,
                      "### Exploration resume after an operator decision",
                      "### Contract-change marker checkpoint",
                  ),
                  [
                      "new docs-only",
                      "exploration checkpoint commit",
                      "Return only after the working tree is clean",
                      "`Disposition:`",
                      "`OPERATOR DECISION` again",
                      "milestone behavior contract, fixed constraints, or RED tests",
                  ],
              ),
              (
                  between(
                      prompts_path,
                      "### Contract-change marker checkpoint",
                      "## Implementation agent",
                  ),
                  [
                      "explicitly approved the exact named clause",
                      "contract-change recovery owns those edits",
                  ],
              ),
          ]
          for section_text, required in section_checks:
              missing = [needle for needle in required if needle not in section_text]
              if missing:
                  raise SystemExit(
                      f"ship-milestone exploration protocol missing: {missing}"
                  )

          tdd_phases = (
              skills
              / "create-milestones"
              / "references"
              / "tdd-phases.md"
          ).read_text(encoding="utf-8")
          if "Only after the owner explicitly approves the change" not in tdd_phases:
              raise SystemExit(
                  "Interactive exploration recovery must require contract-owner approval"
              )
          PY

      - name: Validate docs tree
        run: |
          cp INDEX.md /tmp/INDEX.before
          docs index .
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import re
          import sys

          date_line = re.compile(r"_Generated \d{4}-\d{2}-\d{2}\.")
          before = date_line.sub(
              "_Generated <date>.",
              Path("/tmp/INDEX.before").read_text(encoding="utf-8"),
          )
          after = date_line.sub(
              "_Generated <date>.",
              Path("INDEX.md").read_text(encoding="utf-8"),
          )
          if before != after:
              sys.stdout.writelines(
                  difflib.unified_diff(
                      before.splitlines(keepends=True),
                      after.splitlines(keepends=True),
                      fromfile="committed INDEX.md",
                      tofile="docs index .",
                  )
              )
              raise SystemExit("INDEX.md is not in sync with docs index output")
          PY
          docs check .   # stale window from .docs.toml [check] stale_days

      - uses: ruby/setup-ruby@v1
        if: ${{ hashFiles('site/Gemfile') != '' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build site if present
        if: ${{ hashFiles('site/Gemfile') != '' }}
        run: bundle exec jekyll build
        working-directory: site
