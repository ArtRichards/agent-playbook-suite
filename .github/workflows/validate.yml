          stale_quality_log_paths = []
          for path in sorted(root.rglob("*.md")):
              rel = path.as_posix()
              if rel.startswith((
                  "plugins/agent-playbook-suite/skills/docs/",
                  "docs/",
              )):
                  continue
              if collision_prone_quality_log in path.read_text(encoding="utf-8"):
                  stale_quality_log_paths.append(rel)
          if stale_quality_log_paths:
              raise SystemExit(
                  "Collision-prone quality-log convention remains outside the "
                  f"vendored docs payload: {stale_quality_log_paths}"
              )
          PY

      - name: Validate docs tree
        run: |
          cp INDEX.md /tmp/INDEX.before
          docs index .
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import re
          import sys

          date_line = re.compile(r"_Generated \d{4}-\d{2}-\d{2}\.")
          before = date_line.sub(
              "_Generated <date>.",
              Path("/tmp/INDEX.before").read_text(encoding="utf-8"),
          )
          after = date_line.sub(
              "_Generated <date>.",
              Path("INDEX.md").read_text(encoding="utf-8"),
          )
          if before != after:
              sys.stdout.writelines(
                  difflib.unified_diff(
                      before.splitlines(keepends=True),
                      after.splitlines(keepends=True),
                      fromfile="committed INDEX.md",
                      tofile="docs index .",
                  )
              )
              raise SystemExit("INDEX.md is not in sync with docs index output")
          PY
          docs check .   # stale window from .docs.toml [check] stale_days

      - uses: ruby/setup-ruby@v1
        if: ${{ hashFiles('site/Gemfile') != '' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build site if present
        if: ${{ hashFiles('site/Gemfile') != '' }}
        run: bundle exec jekyll build
        working-directory: site
